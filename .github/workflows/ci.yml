name: Build y tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Tests unitarios, lint y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle con caché de dependencias
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios (domain, data, app)
        run: ./gradlew test

      - name: Build completo con lint de Android
        run: ./gradlew build

      - name: Publicar informes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-tests
          path: '**/build/reports/tests/'

      - name: Publicar APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: character-finder-debug
          path: app/build/outputs/apk/debug/*.apk
